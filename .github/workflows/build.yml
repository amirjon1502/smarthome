name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Resolve project directory
        id: project_dir
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "SmartHome/settings.gradle.kts" ] || [ -f "SmartHome/settings.gradle" ]; then
            echo "dir=SmartHome" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle.kts or settings.gradle" >&2
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project_dir.outputs.dir }}
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-apk
          path: ${{ steps.project_dir.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
